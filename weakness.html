<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="JCSQE初級の弱点対策。レビュー・テスト・統計・AI品質などの独自高難度40問。全選択肢の解説、弱点復習、学習記録。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>JCSQE初級｜弱点補強ドリル40問</title>
<style>
:root{color-scheme:dark;--bg:#0b1120;--panel:#131f32;--soft:#1c2c40;--line:#354761;--ink:#edf4fc;--muted:#b4c7d8;--brand:#79e7d1;--brandink:#092e2a;--ok:#9bffcf;--bad:#ffc0bd;font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
:root[data-theme=light]{color-scheme:light;--bg:#f4f7f9;--panel:#fff;--soft:#eaf1f4;--line:#cedbe1;--ink:#1c303d;--muted:#526a78;--brand:#0f7562;--brandink:#fff;--ok:#086b48;--bad:#a02d37}
*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);margin:0;min-height:100dvh}a{color:var(--brand);text-underline-offset:3px}button,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}
button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
header{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(9px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 9px max(16px,env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:center;gap:12px}
header a{font-weight:800;text-decoration:none;color:var(--ink);font-size:15px;line-height:1.4}header small{display:block;color:var(--muted);font-size:11px;font-weight:500}
main{width:min(100%,880px);margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) calc(50px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1{font-size:clamp(25px,6vw,38px);line-height:1.32;margin:0 0 12px}h2{font-size:20px;margin:0 0 10px;line-height:1.5}h3{font-size:16px;margin:0 0 9px}
p{margin:0 0 12px}p:last-child{margin-bottom:0}.small{font-size:13px}.muted{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--brand);font-weight:800;margin-bottom:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:20px;margin:0 0 18px}.hero{margin:16px 0 22px}.tag{display:inline-block;background:var(--soft);border-radius:7px;padding:3px 9px;color:var(--brand);font-size:12px;font-weight:700;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 17px;background:var(--soft);border:1px solid var(--line);border-radius:11px;color:var(--ink);text-align:center;text-decoration:none;font-weight:700}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brandink)}.btn.rowwide{width:100%}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.actions>*{flex:1 1 140px}
.metricgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}.metric{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}.metric b{font-size:clamp(19px,4vw,27px);display:block;line-height:1.2}.metric span{font-size:11px;color:var(--muted)}
label{display:block;font-size:14px;font-weight:700;margin:13px 0 7px}select{width:100%;min-height:45px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px}
.rail{height:9px;background:var(--soft);border-radius:20px;overflow:hidden;margin:13px 0}.rail span{display:block;height:100%;background:var(--brand)}
.option{width:100%;display:flex;gap:12px;text-align:left;align-items:flex-start;min-height:59px;padding:12px 13px;margin:8px 0;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);line-height:1.65}
.option b{flex:none;display:grid;place-items:center;width:29px;height:29px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:13px}.option:disabled{opacity:1}.option.correct{border-color:var(--ok)}.option.chosen:not(.correct){border-color:var(--bad)}
.question{font-weight:750;font-size:18px;line-height:1.8;white-space:pre-wrap;margin:17px 0}.reason{padding:11px 13px;margin:8px 0;border:1px solid var(--line);border-radius:11px;background:var(--soft);font-size:14px}.reason.good{border-color:var(--ok)}.reason.bad{border-color:var(--bad)}.reason strong{display:block}.reason p{font-size:13px;color:var(--muted)}
.status{border-left:4px solid var(--brand);background:var(--soft);padding:12px 14px;border-radius:9px;margin:10px 0 16px}.status.error{border-left-color:var(--bad)}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-weight:650}.resultitem{padding:10px 0;border-bottom:1px solid var(--line)}
textarea{color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:9px;width:100%;min-height:140px;padding:9px}
@media(max-width:520px){.card{padding:15px}.metric{padding:9px 5px}.metricgrid{gap:6px}.question{font-size:16px}.option{font-size:14px}main{padding-top:15px}}
</style>
</head>
<body>
<div id="weakness-app"><main><p>弱点対策問題を読み込んでいます…</p></main></div>
<noscript>JavaScriptを有効にしてご利用ください。</noscript>
<script src="./advanced-syllabus-v16.js?v=16.0"></script>

<script src="./weakness-q2-v18.js?v=18.0"></script>
<script src="./weakness-q3-v18.js?v=18.0"></script>
<script src="./weakness-q4-v18.js?v=18.0"></script>
<script src="./weakness-bank-v18.js?v=18.0"></script>
<script src="./weakness-ui-v18.js?v=18.0"></script>
</body>
</html>
