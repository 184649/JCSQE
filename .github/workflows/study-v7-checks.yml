name: Study v7 checks
on:
  push:
    paths:
      - 'study-*'
      - 'study.css'
      - 'supplement.js'
      - 'questions.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/study-v7-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact public commit
        env:
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPO}.git"
          git fetch --depth=1 origin "$COMMIT_SHA"
          git checkout --detach FETCH_HEAD
      - name: Validate questions and study logic
        run: node --test tests/study-v7.test.cjs
      - name: Parse browser scripts
        run: |
          node --check study-core.js
          node --check study-app.js
          node --check supplement.js
          node --check sw.js
