name: Acronym explanation checks
on:
  push:
    paths:
      - 'acronym-*'
      - 'keyword-*'
      - 'tests/acronym*'
      - 'index.html'
      - 'practice.html'
      - 'benchmark.html'
      - 'sw.js'
      - '.github/workflows/acronym-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: All regression tests and syntax
        run: |
          node --check acronym-explanations.js
          node --test tests/*.test.cjs
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Acronym display, preservation, no hints and offline reload
        run: python tests/acronym-browser-smoke.py
